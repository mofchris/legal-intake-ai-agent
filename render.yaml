# Render Blueprint — deploys the FastAPI backend as a free web service.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo, or use the
# "Deploy to Render" button in backend/README.md. Set OPENAI_API_KEY when prompted.
services:
  - type: web
    name: legal-intake-ai-agent-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secret — set this in the Render dashboard (do not commit a key).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # false = call OpenAI. Set to true to run without a key (mock analysis).
      - key: DEMO_MODE
        value: "false"
      - key: LOG_REDACT_PII
        value: "true"
      # Origins allowed to call the API (the GitHub Pages demo + local dev).
      - key: CORS_ORIGINS
        value: "https://mofchris.github.io,http://localhost:5173,http://localhost:5174"
